# Arabic text that the platform changes on the login screens. Every other
# message is Keycloak's own Arabic.
#
# DRAFT, AWAITING THE OWNER'S REVIEW (LANG-7). Nothing here has been read by
# an Arabic speaker yet, so it must not reach a Vendor as it is.

# A Vendor's Login is named by its login phone number, which is what the
# login screen's name field asks for.
username=رقم الهاتف

# Keycloak's own errors name the field "username". These say "phone number",
# as the field does. A locked Login is shown the same text as a wrong
# password, so that nobody learns that the Login is locked.
invalidUserMessage=رقم الهاتف أو كلمة المرور غير صحيحة.
accountTemporarilyDisabledMessage=رقم الهاتف أو كلمة المرور غير صحيحة.
invalidPasswordNotUsernameMessage=كلمة المرور غير صالحة: يجب ألا تكون رقم الهاتف.

# Keycloak's own Arabic titles the screen that asks for a new password "the
# password has been updated", before anything is updated.
updatePasswordTitle=تحديث كلمة المرور

# The realm's password policy, length(8), as that screen states it. Keycloak
# gives the length as {0} and writes it in the language's own digits, which
# for Arabic are Arabic-Indic, and every number the platform shows is in
# Western digits (LANG-5). So the 8 is written here, and changes when the
# realm's length changes; pnpm platform:check fails until it does.
invalidPasswordMinLengthMessage=كلمة المرور غير صالحة: الحد الأدنى للطول 8.
