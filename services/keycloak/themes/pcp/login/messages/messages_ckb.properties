# Kurdish (Sorani) text for the screens of Keycloak that a Vendor meets: the
# login screen, and the screen that asks for a new password after a login
# with a temporary password.
#
# DRAFT, AWAITING THE OWNER'S REVIEW (LANG-7). Nothing here has been read by
# a Sorani speaker yet, so it must not reach a Vendor as it is. The words for
# the platform's terms are the word list's, in libs/i18n/src/messages/words.md.
#
# Any text that is missing here is shown in Keycloak's English.

# Keycloak names this language itself, as "کوردیی ناوەندی". If it is ever
# given another name here, with the key locale_ckb, the name must be written
# in Kurdish script: Keycloak takes the direction of the screen from the
# direction of that name, and a name in Latin letters lays the Kurdish
# screens out left to right.

# The login screen.
loginTitle=چوونەژوورەوە بۆ {0}
loginAccountTitle=چوونەژوورەوە بۆ هەژمارەکەت
# A Vendor's Login is named by its login phone number, which is what the
# name field asks for.
username=ژمارەی تەلەفۆن
password=وشەی نهێنی
doLogIn=چوونەژوورەوە
showPassword=پیشاندانی وشەی نهێنی
hidePassword=شاردنەوەی وشەی نهێنی
invalidUserMessage=ژمارەی تەلەفۆن یان وشەی نهێنی هەڵەیە.
# What a Login that brute-force detection has locked is shown, even with its
# right password. Keycloak gives it the same text as a wrong password, so
# that nobody learns that the Login is locked, and so does this file.
accountTemporarilyDisabledMessage=ژمارەی تەلەفۆن یان وشەی نهێنی هەڵەیە.
# What a disabled Login, the Login of a deactivated Vendor, is shown when it
# gives its right password. A wrong one is shown the text of a wrong password.
# "The Admin" is the word list's.
accountDisabledMessage=ئەم هەژمارە ناچالاک کراوە. پەیوەندی بە بەڕێوەبەرەوە بکە.

# The screen that asks for a new password.
updatePasswordTitle=گۆڕینی وشەی نهێنی
updatePasswordMessage=بۆ چالاککردنی هەژمارەکەت، دەبێت وشەی نهێنییەکەت بگۆڕیت.
passwordNew=وشەی نهێنیی نوێ
passwordConfirm=دووبارەکردنەوەی وشەی نهێنی
logoutOtherSessions=چوونەدەرەوە لە ئامێرەکانی تر
doSubmit=ناردن
missingPasswordMessage=تکایە وشەی نهێنی بنووسە.
notMatchPasswordMessage=وشە نهێنییەکان وەک یەک نین.

# The realm's password policy, length(8) and notUsername, as that screen
# states it. Keycloak gives the length as {0} and writes it in the language's
# own digits, which for Kurdish are Arabic-Indic, and every number the
# platform shows is in Western digits (LANG-5). So the 8 is written here, and
# changes when the realm's length changes; pnpm platform:check fails until it
# does.
invalidPasswordMinLengthMessage=وشەی نهێنی نادروستە: دەبێت لانیکەم 8 پیت بێت.
invalidPasswordNotUsernameMessage=وشەی نهێنی نادروستە: نابێت هەمان ژمارەی تەلەفۆن بێت.
