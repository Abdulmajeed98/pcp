# Kurdish (Sorani) text for the login screen.
#
# DRAFT, AWAITING THE OWNER'S REVIEW (LANG-7). Nothing here has been read by
# a Sorani speaker yet, so it must not reach a Vendor as it is.
#
# Only the login screen is covered. Any text that is missing here is shown in
# Keycloak's English.

# Keycloak names this language itself, as "کوردیی ناوەندی". If it is ever
# given another name here, with the key locale_ckb, the name must be written
# in Kurdish script: Keycloak takes the direction of the screen from the
# direction of that name, and a name in Latin letters lays the Kurdish
# screens out left to right.

loginTitle=چوونەژوورەوە بۆ {0}
loginAccountTitle=چوونەژوورەوە بۆ هەژمارەکەت
# A Vendor's Login is named by its login phone number, which is what the
# name field asks for.
username=ژمارەی تەلەفۆن
password=وشەی نهێنی
doLogIn=چوونەژوورەوە
showPassword=پیشاندانی وشەی نهێنی
hidePassword=شاردنەوەی وشەی نهێنی
invalidUserMessage=ژمارەی تەلەفۆن یان وشەی نهێنی هەڵەیە.
