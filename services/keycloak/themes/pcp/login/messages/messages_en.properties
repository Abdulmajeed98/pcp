# English text that the platform changes on the login screens. Every other
# message is Keycloak's own English.

# A Vendor's Login is named by its login phone number and the Admin's by a
# name, so the login screen's name field asks for either.
username=Phone number or name

# Keycloak's own errors name the field "username". These say "phone number"
# and "name", as the field does. A locked Login is shown the same text as a
# wrong password, so that nobody learns that the Login is locked.
invalidUserMessage=Invalid phone number, name or password.
accountTemporarilyDisabledMessage=Invalid phone number, name or password.
invalidPasswordNotUsernameMessage=Invalid password: must not be the phone number.
