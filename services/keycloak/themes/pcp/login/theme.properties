# The platform's login screens. Everything comes from Keycloak's own login
# theme, and no template of it is copied here. This one adds Kurdish
# (Sorani), which Keycloak does not ship, labels the name field "phone
# number" in the three languages and names it so in their errors, corrects
# two of Keycloak's Arabic messages, and adds one script.
parent=keycloak.v2
locales=ckb,ar,en
# Turns a phone number typed on the login screen into the stored form.
scripts=js/phone-number.js
