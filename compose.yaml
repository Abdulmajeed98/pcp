# The services the platform needs while it is being developed. This file is
# for development only: nothing in it is fit for a server.
#
# Start, stop and check the services with the `pnpm services:*` commands.
# Every setting comes from `.env`, which `pnpm services:up` creates.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, as .env.example describes}
      # Read by the set-up script below, which creates the two database users.
      PCP_DB_PASSWORD: ${PCP_DB_PASSWORD:?set it in .env, as .env.example describes}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it in .env, as .env.example describes}
    ports:
      # Published on the loopback address only, so that the database is never
      # open to the network the machine happens to be on.
      - '127.0.0.1:5432:5432'
    volumes:
      # Since version 18 the image keeps its data in a folder named after the
      # major version, under this path.
      - postgres-data:/var/lib/postgresql
      # The image runs this script once, when the data volume is empty.
      - ./services/postgres/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
    healthcheck:
      # Asked over TCP on purpose. While the image sets a new database up it
      # runs a temporary server that listens on a socket only, and that server
      # must not count as ready.
      test: ['CMD', 'pg_isready', '--host', '127.0.0.1', '--username', 'postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # Development mode, and the realm file below loaded on the first start.
    command: ['start-dev', '--import-realm']
    environment:
      # Keycloak keeps everything in its own database on the PostgreSQL server.
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it in .env, as .env.example describes}
      # Keycloak's own administrator account, which opens Keycloak's console.
      # It is created on the first start and is not the platform's Admin.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMINISTRATOR_NAME:?set it in .env, as .env.example describes}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMINISTRATOR_PASSWORD:?set it in .env, as .env.example describes}
      # Serves the health pages on port 9000, which only the health check
      # below reaches.
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    # Keycloak's container guide asks for a limit always to be set, because
    # the Java heap is sized from it.
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Keycloak imports a realm from this folder only when the realm does
      # not exist yet.
      - ./services/keycloak/import:/opt/keycloak/data/import:ro
      # The platform's own theme, which adds Kurdish (Sorani) to the login
      # screens.
      - ./services/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image has no curl, so the request is written to a socket by hand,
      # as Keycloak's health guide shows.
      test:
        - CMD
        - bash
        - -c
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s

volumes:
  postgres-data:
