<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The browser's bar in the Stone Frame's colour of each scheme, the
         device's until a scheme is chosen with the switch. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f1f0ed"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0d0d0d"
      data-scheme="dark"
    />
    <script>
      // The colour scheme chosen with the scheme switch, set before the first
      // paint so that no screen flashes the other scheme (DESIGN.md), and the
      // browser's bar in its Stone Frame's colour. The key, and the way the
      // bar's colour is chosen, are the ones src/shared/lib/scheme.ts keeps.
      try {
        var scheme = localStorage.getItem('scheme');
        if (scheme === 'light' || scheme === 'dark') {
          document.documentElement.dataset.scheme = scheme;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (bar) {
            bar.media = bar.dataset.scheme === scheme ? 'all' : 'not all';
          });
        }
      } catch (refused) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
